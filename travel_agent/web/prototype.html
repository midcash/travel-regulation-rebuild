<script>

const variants=['calendar','conversation','tasks'];

const initialVariant=new URLSearchParams(location.search).get('variant');
const state={
  variant:variants.includes(initialVariant)?initialVariant:'conversation',view:'home',week:0,list:false,
  workspaceTask:'trip-shanghai',artifactTab:'plan',
  selected:null,tab:'plan',draft:null,messages:[],draftInput:'',hotel:'quiet',evalTab:'model',evalRan:false,
  preferences:{origin:'杭州',mode:'train',quiet:true,buffer:'30',remember:true},
  tasks:[
    {id:'trip-shanghai',title:'上海 · 客户方案评审',city:'上海',venue:'上海国际会议中心',date:'2026-11-06',time:'09:00',status:'planned',mode:'train',version:1,hotel:'quiet',notes:'提前一晚抵达。酒店安静一些。',created:'10 月 12 日',source:'用户确认 · 需求版本 v1'},
    {id:'trip-suzhou',title:'苏州 · 项目沟通',city:'苏州',venue:'',date:'2026-11-12',time:'10:00',status:'draft',mode:'train',version:1,notes:'领导安排了项目沟通，还没有确认具体会场。',created:'10 月 12 日',source:'自然语言草稿'},
    {id:'trip-shenzhen',title:'深圳 · 业务交流',city:'深圳',venue:'深圳会展中心',date:'2026-11-18',time:'09:30',status:'waiting',mode:'flight',version:1,notes:'优先酒店安静，两个候选需要选择。',created:'10 月 11 日',source:'用户确认 · 需求版本 v1'},

};

function processInput(text){
 text=text.trim();if(!text){toast('先描述一下你的出差安排。');return}
 state.messages.push({who:'user',text});
 const old=state.draft||{};const from=state.fromTask||{};
 const city=['上海','苏州','深圳','南京'].find(c=>text.includes(c))||old.city||from.city||'';
 const match=text.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]?/);
 const time=text.match(/(?:上午|下午|晚上)?\s*(\d{1,2})\s*(?:点|[:：])\s*(\d{1,2})?/);
 let hour=time?Number(time[1]):null;if(hour!==null&&/下午|晚上/.test(text)&&hour<12)hour+=12;
 const venue=text.match(/(?:在|会场[是为：:]?)\s*([^，。,；\n]{2,30}(?:会议中心|会展中心|国际博览中心|东方明珠塔))/);
 const date=match?'2026-'+String(match[1]).padStart(2,'0')+'-'+String(match[2]).padStart(2,'0'):old.date||from.date||'';
 // shortcut: this parser supports explicit Chinese dates and a few demo cities; replace with model extraction for production.
 state.draft={city,date,time:hour===null?(old.time||from.time||''):String(hour).padStart(2,'0')+':'+(time[2]||'00').padStart(2,'0'),
 venue:venue?venue[1]:(old.venue||from.venue||''),origin:old.origin||state.preferences.origin,
 mode:/飞机|航班/.test(text)?'flight':/高铁|火车/.test(text)?'train':old.mode||state.preferences.mode,
 previous:true,notes:text,buffer:state.preferences.buffer};
 const missing=[];if(!city)missing.push('会议城市');if(!date||!state.draft.time)missing.push('明确的会议日期与时间');if(!state.draft.venue)missing.push('具体会场');
 state.messages.push({who:'agent',text:missing.length?'我已经整理了已知信息。还需要确认：'+missing.join('、')+'。你可以继续告诉我，也可以直接补充右侧草稿。':'需求已整理。请核对右侧草稿；确认后再开始查询交通、酒店和路线。'});
 render();
}

 events.forEach((e,i)=>lines.push('BEGIN:VEVENT','UID:'+t.id+'-'+i+'@xinglv-prototype','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;TZID=Asia/Shanghai:'+stamp(e.date,e.start),'DTEND;TZID=Asia/Shanghai:'+stamp(e.endDate||e.date,e.end),'SUMMARY:'+icsEsc(e.title),'LOCATION:'+icsEsc(e.location),'DESCRIPTION:产品原型演示。规划安排并不代表已预订。','END:VEVENT'));lines.push('END:VCALENDAR');
 const text=ics?lines.join('\r\n')+'\r\n':'# '+t.title+'\n\n产品原型演示，未预订。不是实际供应商查询结果。\n\n'+events.map(e=>'- '+e.date+' '+e.start+'–'+e.end+' '+e.title+' · '+e.location).join('\n')+'\n\n费用未完整计价。私人偏好和完整对话未包含。\n';
 const url=URL.createObjectURL(new Blob([text],{type:ics?'text/calendar;charset=utf-8':'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='行旅-演示行程.'+(ics?'ics':'md');a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已生成演示文件；没有写入任何外部日历。');
}
function showTrace(t){
 showModal('运行记录 · 演示样例','<p class="tripmeta" style="margin-top:12px">'+esc(t.title)+' · 需求 v'+t.version+'</p><div class="note" style="margin:15px 0">这里展示可观察的动作、结果和耗时，不展示模型隐藏思考。所有数据均为演示。</div>'+[
 ['需求理解','提取并确认会议时间和地点','1.2 秒',20],['交通查询','候选与供应商时刻 · E01','2.8 秒',48],['酒店查询','日期和候选 · E03','2.1 秒',36],['人工选择','等待用户 · 已确认候选','不计活跃',0],['路线查询','查询时估计 · E02 / E04','3.4 秒',58],['结果校验','时间、地点、引用与选择','0.1 秒',5]
 ].map(x=>'<div class="traceitem"><small>'+x[0]+'</small><div>'+x[1]+'<div class="meter"><span style="width:'+x[3]+'%"></span></div></div><small>'+x[2]+'</small></div>').join('')+'<p class="evaluationcaption">目标页面会关联真实 Trace；当前仅展示字段和信息层级。</p>');
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-close]');if(!b)return;
 if(b.hasAttribute('data-nav')){state.view=b.dataset.nav;state.selected=null;render()}
 if(b.hasAttribute('data-variant')){state.variant=b.dataset.variant;state.view='home';state.selected=null;const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);render()}
 if(b.hasAttribute('data-new'))newDraft();
 if(b.hasAttribute('data-home-send'))newDraft($('home-input').value);
 if(b.hasAttribute('data-example')){const text=b.dataset.example==='上海'?'11 月 6 日上午 9 点，在上海国际会议中心开会，杭州出发，提前住一晚。':'11 月 12 日上午 10 点去苏州参加项目沟通，具体会场还没确定。';if(state.view==='plan')processInput(text);else newDraft(text)}
 if(b.hasAttribute('data-send'))processInput($('draft-input').value);
 if(b.hasAttribute('data-confirm'))startPlanning();
 if(b.hasAttribute('data-task')){const t=state.tasks.find(x=>x.id===b.dataset.task);if(state.variant==='conversation'){state.workspaceTask=t.id;state.selected=null;state.view='home';state.artifactTab='plan';render()}else{state.selected=t.id;state.tab=['waiting','draft','stale'].includes(t.status)?'chat':'plan';renderDrawer()}}
 if(b.hasAttribute('data-artifact')){state.artifactTab=b.dataset.artifact;renderWorkspace()}
 if(b.hasAttribute('data-workspace-send')){const text=$('workspace-message').value.trim();if(!text){toast('请先补充你的需求。');return}newDraft(text,state.tasks.find(x=>x.id===b.dataset.workspaceSend))}
 if(b.hasAttribute('data-close')){state.selected=null;renderDrawer()}
 if(b.hasAttribute('data-tab')){if(state.variant==='conversation'&&state.view==='home'){state.artifactTab=b.dataset.tab==='chat'?'plan':b.dataset.tab;renderWorkspace()}else{state.tab=b.dataset.tab;renderDrawer()}}
 if(b.hasAttribute('data-week')){state.week=Number(b.dataset.week)===0?0:state.week+Number(b.dataset.week);renderCalendar()}
 if(b.hasAttribute('data-list')){state.list=!state.list;renderCalendar()}
 if(b.hasAttribute('data-revise')){const t=state.tasks.find(x=>x.id===b.dataset.revise);newDraft(t.notes,t)}
 if(b.hasAttribute('data-task-message')){const t=state.tasks.find(x=>x.id===b.dataset.taskMessage);const text=$('task-message').value.trim();if(text)newDraft(text,t);else toast('请描述需要修改的要求。')}
 if(b.hasAttribute('data-hotel')){const t=state.tasks.find(x=>x.id===b.dataset.hotel);t.hotel=document.querySelector('input[name="hotel"]:checked').value;t.status='planned';state.tab='plan';render();toast('演示选择已确认，方案已加入行程。')}
 if(b.hasAttribute('data-reject-hotels')){const t=state.tasks.find(x=>x.id===b.dataset.rejectHotels);t.status='failed';state.tab='chat';render();toast('演示：候选不满足要求，未补造新酒店。')}
 if(b.hasAttribute('data-save-prefs')){const buffer=$('pref-buffer').value;if(Number(buffer)<0||Number(buffer)>120){toast('请输入 0–120 分钟。');return}state.preferences={origin:$('pref-origin').value.trim(),mode:$('pref-mode').value,quiet:$('pref-quiet').checked,buffer,remember:$('pref-remember').checked};renderPreferences();toast('偏好已保存到当前演示会话。')}
 if(b.hasAttribute('data-reset-prefs')){state.preferences={origin:'',mode:'any',quiet:false,buffer:'0',remember:true};renderPreferences();toast('当前演示会话的偏好已清除。')}
 if(b.hasAttribute('data-export'))showExport(state.tasks.find(x=>x.id===b.dataset.export));
 if(b.hasAttribute('data-modal-close'))$('modal').remove();
 if(b.hasAttribute('data-download-ics'))exportText(state.tasks.find(x=>x.id===b.dataset.downloadIcs),true);
 if(b.hasAttribute('data-download-md'))exportText(state.tasks.find(x=>x.id===b.dataset.downloadMd),false);
 if(b.hasAttribute('data-trace'))showTrace(state.tasks.find(x=>x.id===b.dataset.trace));
 if(b.hasAttribute('data-eval-tab')){state.evalTab=b.dataset.evalTab;renderEvaluation()}
 if(b.hasAttribute('data-run-eval')){b.disabled=true;b.textContent='正在演示评测…';setTimeout(()=>{state.evalRan=true;if(state.view==='eval')renderEvaluation();toast('演示批次已完成。该原型没有实际执行模型评测。')},900)}
 if(b.hasAttribute('data-live-info'))showModal('真实链路验收','<div class="stack" style="margin-top:18px"><p>真实模型＋真实供应商，单独保存联调记录。</p><div class="note">目标记录包括：查询时间、供应商状态、最终业务结论、耗时、调用量与 Trace。供应商故障与模型错误分开分类。</div><p class="muted">这部分不与固定环境的评测结果合并，原型中没有调用真实接口。</p></div>');
 if(b.hasAttribute('data-case'))showModal('场景诊断','<div class="stack" style="margin-top:18px"><span class="badge neutral">报告样例 · 非真实运行</span><h3>'+(Number(b.dataset.case)===4&&state.evalTab==='model'?'会议时间变化后，旧路线证据未完全隔离':'满足该场景预先定义的验收条件')+'</h3><p>核对需求版本、工具证据、人工选择和最终状态。评分依据独立于 Agent 自述。</p><div class="note">失败样例会沉淀成固定回归用例。展示重点是“为什么失败”，而不是单一总分。</div><button data-trace="trip-shanghai">查看动作记录样例</button></div>');
});
document.addEventListener('change',e=>{if(['export-meeting','export-travel'].includes(e.target.id)){const t=state.tasks.find(x=>x.id===(state.selected||state.workspaceTask));if(t)updateExportPreview(t)}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if($('modal'))$('modal').remove();else{state.selected=null;renderDrawer()}}
 if(e.ctrlKey&&e.key==='Enter'&&e.target.id==='draft-input')processInput(e.target.value);
 if(e.ctrlKey&&e.key==='Enter'&&e.target.id==='workspace-message'){const text=e.target.value.trim();if(text)newDraft(text,state.tasks.find(x=>x.id===state.workspaceTask))}
 if(['ArrowLeft','ArrowRight'].includes(e.key)&&!e.target.closest('input,textarea,select,[contenteditable]')){const i=variants.indexOf(state.variant);state.variant=variants[(i+(e.key==='ArrowRight'?1:2))%3];state.view='home';state.selected=null;const url=new URL(location.href);url.searchParams.set('variant',state.variant);history.replaceState(null,'',url);render()}
});
render();
</script>
</body>
</html>
