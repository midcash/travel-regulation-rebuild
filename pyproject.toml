[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent-lab"
version = "0.1.0"
description = "Evidence-grounded support investigation agent with traces and regression gates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp-proto-http>=1.27,<2"]

[project.scripts]
support-agent = "support_agent.cli:main"

[tool.setuptools.packages.find]
include = ["support_agent*"]

[tool.setuptools.package-data]
support_agent = ["data/*.json", "prompts/*.txt", "web/*"]
