[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent-lab"
version = "0.1.0"
description = "Travel planning agent adapted from observation, with traces and regression gates"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp-proto-http>=1.27,<2"]

[project.scripts]
travel-agent = "travel_agent.cli:main"

[tool.setuptools.packages.find]
include = ["travel_agent*"]

[tool.setuptools.package-data]
travel_agent = ["data/*.json", "prompts/*.txt", "web/*"]
