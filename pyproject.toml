[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent-lab"
version = "0.1.0"
description = "Travel supplier tools and isolated Pi protocol verification"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp-proto-http>=1.27,<2"]

[tool.setuptools.packages.find]
include = ["travel_agent*"]
