name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Install Python package
        run: python -m pip install -e ".[otel]"

      - name: Install locked product Pi dependencies
        run: npm.cmd ci --ignore-scripts --no-audit --no-fund

      - name: Install locked Pi dependencies
        run: npm.cmd ci --prefix verification/pi-step0 --ignore-scripts --no-audit --no-fund

      - name: Install locked Durable dependencies
        run: npm.cmd ci --prefix verification/durable-step0 --ignore-scripts --no-audit --no-fund

      - name: Offline tool, Pi and Durable checks
        run: python -B -X utf8 scripts/check.py

  durable-portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: "22.19.0"
          - os: ubuntu-latest
            node: "24"
          - os: windows-latest
            node: "24"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked Durable dependencies
        run: npm ci --prefix verification/durable-step0 --ignore-scripts --no-audit --no-fund
      - name: Offline Durable platform boundaries
        run: python -B -X utf8 -m unittest discover -s verification/durable-step0 -v
