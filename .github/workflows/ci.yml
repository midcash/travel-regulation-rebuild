name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python package
        run: python -m pip install -e ".[otel]"

      - name: Install locked Pi dependencies
        run: npm.cmd ci --prefix verification/pi-step0 --ignore-scripts --no-audit --no-fund

      - name: Offline tool and Pi protocol checks
        run: python -B -X utf8 scripts/check.py
