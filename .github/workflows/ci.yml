name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python package
        run: python -m pip install -e ".[otel]"

      - name: Install locked Pi SDK (step0)
        working-directory: verification/pi-step0
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Python tests
        run: python -B -X utf8 -m unittest discover -s tests -v

      - name: Node UI tests
        run: |
          node tests/agent_workspace_ui.test.cjs
          node tests/hil_ui.test.cjs
          node tests/request_ui.test.cjs

      - name: Pi step0 contract tests
        run: python -X utf8 -m unittest discover -s verification/pi-step0 -p test_contracts.py -v
